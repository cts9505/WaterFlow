<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>WaterFlow — Water Tanker Delivery | Book Instantly</title>
    <meta name="description" content="WaterFlow is India's smartest water tanker booking platform. Book a tanker in under 2 minutes with live GPS tracking, transparent pricing, and verified water offices near you." />
    <meta name="keywords" content="water tanker, water delivery, tanker booking, water supply, water tanker near me, water tanker service, emergency water supply, WaterFlow" />
    <meta name="author" content="WaterFlow" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://waterflow.in/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WaterFlow" />
    <meta property="og:title" content="WaterFlow — Water Tanker at Your Doorstep" />
    <meta property="og:description" content="Book a water tanker instantly. Live GPS tracking, transparent pricing, and verified offices serving your area." />
    <meta property="og:url" content="https://waterflow.in/" />
    <meta property="og:image" content="https://waterflow.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WaterFlow — Water Tanker at Your Doorstep" />
    <meta name="twitter:description" content="Book a water tanker instantly. Live GPS tracking, transparent pricing, and verified offices serving your area." />
    <meta name="twitter:image" content="https://waterflow.in/og-image.png" />

    <!-- Mobile App Meta -->
    <meta name="theme-color" content="#1A56DB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WaterFlow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="WaterFlow" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured Data: LocalBusiness + SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "WaterFlow",
          "url": "https://waterflow.in",
          "description": "India's smartest water tanker booking platform. Book instantly with live GPS tracking.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Web",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR",
            "description": "Free to book. Pay per delivery."
          },
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.8",
            "ratingCount": "10000"
          }
        },
        {
          "@type": "Organization",
          "name": "WaterFlow",
          "url": "https://waterflow.in",
          "logo": "https://waterflow.in/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "availableLanguage": ["English", "Hindi"]
          },
          "sameAs": []
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How do I book a water tanker on WaterFlow?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Open WaterFlow, allow location access, find nearby water offices on the map, select your tanker size, and book instantly. You can also call the office directly."
              }
            },
            {
              "@type": "Question",
              "name": "Can I track my water tanker delivery?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! WaterFlow provides live GPS tracking. Once your booking is accepted, you can watch the tanker approaching your location in real-time."
              }
            },
            {
              "@type": "Question",
              "name": "What areas does WaterFlow serve?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "WaterFlow serves areas where verified water offices operate. Each office defines its service radius, and you can see all offices covering your location on the map."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
